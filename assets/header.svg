<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="200" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" fill-opacity="0.08" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="850" height="200" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="850" height="200" rx="16" fill="url(#grid)" />

  <!-- Top accent glowing line -->
  <rect x="25" y="1" width="800" height="2" fill="url(#line-grad)" />

  <!-- Terminal window control dots -->
  <circle cx="36" cy="32" r="5" fill="#ef4444" opacity="0.85" />
  <circle cx="52" cy="32" r="5" fill="#eab308" opacity="0.85" />
  <circle cx="68" cy="32" r="5" fill="#22c55e" opacity="0.85" />

  <text x="88" y="36" fill="#64748b" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" font-weight="500">system://rahulambhore/profile ~</text>

  <!-- Status pill -->
  <g transform="translate(680, 22)">
    <rect width="138" height="24" rx="12" fill="#0f291e" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.5" />
    <circle cx="14" cy="12" r="4" fill="#22c55e" filter="url(#glow)" />
    <text x="26" y="16" fill="#4ade80" font-family="'SF Pro Display', -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">OPEN TO WORK</text>
  </g>

  <!-- Main Name Header -->
  <text x="36" y="98" fill="url(#title-grad)" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Rahul Ambhore</text>

  <!-- Subtitle -->
  <text x="38" y="130" fill="#cbd5e1" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" letter-spacing="0.2">Software Engineer  •  Backend &amp; Mobile Architecture</text>

  <!-- Tech tags bar -->
  <g transform="translate(36, 152)">
    <rect x="0" y="0" width="70" height="22" rx="4" fill="#1e293b" />
    <text x="35" y="15" fill="#38bdf8" font-family="'SF Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">KOTLIN</text>

    <rect x="78" y="0" width="56" height="22" rx="4" fill="#1e293b" />
    <text x="106" y="15" fill="#fb923c" font-family="'SF Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">JAVA</text>

    <rect x="142" y="0" width="108" height="22" rx="4" fill="#1e293b" />
    <text x="196" y="15" fill="#4ade80" font-family="'SF Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">SPRING BOOT</text>

    <rect x="258" y="0" width="104" height="22" rx="4" fill="#1e293b" />
    <text x="310" y="15" fill="#a78bfa" font-family="'SF Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">ANDROID SDK</text>

    <rect x="370" y="0" width="108" height="22" rx="4" fill="#1e293b" />
    <text x="424" y="15" fill="#60a5fa" font-family="'SF Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">POSTGRESQL</text>

    <rect x="486" y="0" width="74" height="22" rx="4" fill="#1e293b" />
    <text x="523" y="15" fill="#38bdf8" font-family="'SF Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">DOCKER</text>
  </g>
</svg>